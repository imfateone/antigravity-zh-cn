<!doctype html>
<html>
<head><meta charset="utf-8"><title>Overview &amp; P0 Guard Regression</title></head>
<body>
<div id="app">
  <div data-testid="pane-titlebar-toolbar">
    <button data-testid="toggle-overview-panel" data-tooltip-id="tip-ov"></button>
  </div>

  <!-- Overview Dropdown (2.34.0 Sed structure) -->
  <div data-testid="battle-overview-dropdown">
    <div data-testid="overview-panel" id="dd-panel">
      <div data-testid="overview-panel-host-header"><span id="ext-host-hdr">Settings</span></div>
      <div>
        <div>
          <span class="agy-hover-label" id="dd-overview">Overview</span>
          <button type="button" data-testid="overview-panel-customize-trigger" id="dd-customize" aria-label="Customize Sections"></button>
        </div>
      </div>
      <div>
        <div>
          <div data-testid="overview-decorator-row"><span id="ext-decorator">Settings</span></div>
          <button type="button" data-testid="overview-panel-row-review">
            <span class="agy-hover-label" id="dd-review">Review</span>
            <span data-testid="overview-panel-row-review-detail" id="dd-review-detail">Settings</span>
            <span data-testid="overview-panel-row-review-diff-stats" id="dd-diff-stats">Settings</span>
          </button>
          <button type="button" data-testid="overview-panel-row-files">
            <span class="agy-hover-label" id="dd-files">Files</span>
          </button>
          <button type="button" data-testid="overview-panel-row-terminal">
            <span class="agy-hover-label" id="dd-terminal">Terminal</span>
          </button>
          <div>
            <button type="button" data-testid="overview-panel-row-plugins">
              <span class="agy-hover-label" id="dd-plugins">Plugins</span>
            </button>
            <div id="dd-plugin-sub"><span id="dd-plugin-item">Settings</span></div>
          </div>
        </div>
        <div>
          <div data-testid="overview-accumulated-section-1"><span id="ext-accumulated">Settings</span></div>
          <div class="p-1" id="dd-bg-section">
            <button type="button" id="dd-bg-hdr">
              <span class="agy-hover-label" id="dd-bg-lbl">Background Tasks</span>
              <span id="dd-bg-badge">7</span>
            </button>
            <div id="dd-bg-body"><span id="dd-bg-task-text">Settings</span></div>
            <button type="button" aria-expanded="false" id="dd-bg-more">Show 3 more</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Overview Docked + Aux Section -->
  <div data-testid="overview-panel-host">
    <div data-testid="overview-panel" id="dock-panel">
      <div><div><span class="agy-hover-label" id="dock-overview">Overview</span></div></div>
      <div>
        <div>
          <button type="button" data-testid="overview-panel-row-review">
            <span class="agy-hover-label" id="dock-review">Review</span>
          </button>
        </div>
        <div>
          <div class="p-1">
            <button type="button">
              <span class="agy-hover-label" id="dock-bg-lbl">Background Tasks</span>
              <span id="dock-bg-badge">4</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div data-testid="aux-pane-background-tasks-section">
    <span class="agy-hover-label" id="aux-bg-lbl">Background Tasks</span>
    <span id="aux-bg-badge">2</span>
  </div>

  <!-- P0 GCP Project Combobox Guard vs Normal Select -->
  <div data-select-popup="" data-testid="gcp-project-combobox-popup" class="agy-overlay">
    <div data-testid="gcp-project-combobox-list">
      <div role="option" id="gcp-proj-item" title="Settings">Settings</div>
    </div>
  </div>
  <div data-select-popup="" class="agy-overlay">
    <span id="normal-select-item">System default</span>
  </div>

  <!-- P0 Dynamic boundary attr revocation & plugin prefix guard -->
  <div data-testid="settings-button">
    <span id="dyn-turn-host">Settings</span>
    <div id="agy-monitor-custom-widget"><span id="agy-prefix-guard">Settings</span></div>
  </div>

  <!-- P1 Late class upgrade on mounted dialog -->
  <div role="dialog" id="late-settings-dlg"><span id="late-dlg-lbl">Settings</span></div>

  <!-- P1 Real 2.34.0 nested artifact-editor-header inside artifact-view -->
  <div data-testid="artifact-view">
    <div data-testid="artifact-editor-header">
      <span class="font-semibold" id="nested-art-name">Settings</span>
      <button id="nested-art-close" title="Close">Close</button>
    </div>
    <div data-artifact-content="">
      <button id="nested-art-content-btn">Review</button>
    </div>
  </div>

  <!-- P1 Verified Tooltip + Browser + Bottom Terminal -->
  <div role="tooltip" id="tip-ov"><span id="tip-ov-text">Toggle Overview Panel</span></div>
  <div role="tooltip" id="tip-proj"><span id="tip-proj-text">Settings</span></div>
  <button type="button" data-testid="builtin-browser-reload" title="Reload" id="browser-reload">Reload</button>
  <span data-testid="bottom-terminal-panel-title" id="term-title">Terminal</span>
</div>

<script>
  const guardedNodes = [
    document.getElementById('gcp-proj-item'),
    document.getElementById('ext-host-hdr'),
    document.getElementById('ext-decorator'),
    document.getElementById('ext-accumulated'),
    document.getElementById('dd-review-detail'),
    document.getElementById('dd-diff-stats'),
    document.getElementById('dd-plugin-item'),
    document.getElementById('dd-bg-task-text'),
    document.getElementById('agy-prefix-guard'),
    document.getElementById('nested-art-name'),
    document.getElementById('nested-art-content-btn'),
    document.getElementById('tip-proj-text'),
  ];
  window.__guardedWrites = 0;
  const guardObs = new MutationObserver((records) => {
    window.__guardedWrites += records.length;
  });
  for (const el of guardedNodes) {
    guardObs.observe(el, { childList: true, characterData: true, attributes: true, subtree: true });
  }
</script>
<script src="__LOC_JS_URL__"></script>
<script>
const waitFrames = (n = 2) => new Promise((resolve) => {
  let left = n;
  const step = () => { if (--left <= 0) resolve(); else requestAnimationFrame(step); };
  requestAnimationFrame(step);
});

(async () => {
  try {
    for (let f = 0; f < 40; f++) {
      await waitFrames(1);
      if (document.getElementById('dd-overview').textContent === '概览' &&
          document.getElementById('dyn-turn-host').textContent === '设置') {
        break;
      }
    }
    await waitFrames(3);

    const badgeEl = document.getElementById('dd-bg-badge');
    const badgeTextNode = badgeEl.firstChild;
    const dynTurnInitial = document.getElementById('dyn-turn-host').textContent;
    const lateDlgBefore = document.getElementById('late-dlg-lbl').textContent;

    // 1. Live badge update from 7 -> 8 must preserve text node identity
    badgeTextNode.data = '8';
    // 2. Dynamic boundary attribute addition must revoke & restore source
    document.getElementById('dyn-turn-host').setAttribute('data-agy-turn-host', '1');
    // 3. Late class upgrade on dialog must trigger re-scan
    document.getElementById('late-settings-dlg').className = 'settings-modal-container';

    await waitFrames(4);
    guardObs.disconnect();

    window.__TEST_RESULT__ = {
      ddOverview: document.getElementById('dd-overview').textContent,
      ddCustomizeAria: document.getElementById('dd-customize').getAttribute('aria-label'),
      ddReview: document.getElementById('dd-review').textContent,
      ddFiles: document.getElementById('dd-files').textContent,
      ddTerminal: document.getElementById('dd-terminal').textContent,
      ddPlugins: document.getElementById('dd-plugins').textContent,
      ddBgLbl: document.getElementById('dd-bg-lbl').textContent,
      ddBgBadge: badgeEl.textContent,
      ddBgBadgeSameNode: badgeEl.firstChild === badgeTextNode,
      ddBgMore: document.getElementById('dd-bg-more').textContent,
      extHostHdr: document.getElementById('ext-host-hdr').textContent,
      extDecorator: document.getElementById('ext-decorator').textContent,
      extAccumulated: document.getElementById('ext-accumulated').textContent,
      ddReviewDetail: document.getElementById('dd-review-detail').textContent,
      ddDiffStats: document.getElementById('dd-diff-stats').textContent,
      ddPluginItem: document.getElementById('dd-plugin-item').textContent,
      ddBgTaskText: document.getElementById('dd-bg-task-text').textContent,

      dockOverview: document.getElementById('dock-overview').textContent,
      dockReview: document.getElementById('dock-review').textContent,
      dockBgLbl: document.getElementById('dock-bg-lbl').textContent,
      dockBgBadge: document.getElementById('dock-bg-badge').textContent,
      auxBgLbl: document.getElementById('aux-bg-lbl').textContent,
      auxBgBadge: document.getElementById('aux-bg-badge').textContent,

      gcpProjText: document.getElementById('gcp-proj-item').textContent,
      gcpProjTitle: document.getElementById('gcp-proj-item').getAttribute('title'),
      normalSelectItem: document.getElementById('normal-select-item').textContent,

      dynTurnInitial,
      dynTurnAfter: document.getElementById('dyn-turn-host').textContent,
      agyPrefixGuard: document.getElementById('agy-prefix-guard').textContent,

      lateDlgBefore,
      lateDlgAfter: document.getElementById('late-dlg-lbl').textContent,

      nestedArtName: document.getElementById('nested-art-name').textContent,
      nestedArtClose: document.getElementById('nested-art-close').textContent,
      nestedArtCloseTitle: document.getElementById('nested-art-close').getAttribute('title'),
      nestedArtContentBtn: document.getElementById('nested-art-content-btn').textContent,

      tipOvText: document.getElementById('tip-ov-text').textContent,
      tipProjText: document.getElementById('tip-proj-text').textContent,
      browserReload: document.getElementById('browser-reload').textContent,
      browserReloadTitle: document.getElementById('browser-reload').getAttribute('title'),
      termTitle: document.getElementById('term-title').textContent,
      guardedWrites: window.__guardedWrites,
    };
    window.__TEST_DONE__ = true;
  } catch (err) {
    window.__TEST_ERROR__ = err && err.stack ? err.stack : String(err);
  }
})();
</script>
</body>
</html>
